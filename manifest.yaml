author: whisper-sec
name: whisper-agent-identity
version: 0.2.0
type: plugin
icon: icon.svg
label:
  en_US: Whisper Agent Identity
description:
  en_US: Give AI agents a real, routable IPv6 identity, then query the whisper.security graph of internet infrastructure. Keyless and anonymous for anyone - verify an IPv6 address is a genuine Whisper agent and who operates it, and run the graph's read procedures (assess a threat posture, identify a vendor, explain a score, generate look-alikes) plus 29 named recipes. Add your Whisper API key to unlock raw Cypher, the multi-step investigation flows, and the control plane - register agents with their own /128 and key, set DNS policy, read logs, revoke, and get egress config so a self-hosted agent's traffic sources from its /128.
created_at: "2026-07-01T00:00:00Z"
resource:
  memory: 1048576
  permission:
    tool:
      enabled: true
plugins:
  tools:
    - provider/whisper.yaml
meta:
  version: 0.2.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
tags:
  - utilities
privacy: PRIVACY.md
