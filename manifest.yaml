author: whisper-sec
name: whisper-agent-identity
version: 0.1.0
type: plugin
icon: icon.svg
label:
  en_US: Whisper Agent Identity
description:
  en_US: Give AI agents a real, routable IPv6 identity. Keyless and anonymous for anyone - is this IPv6 address a genuine Whisper agent, who operates it, its RDAP record, its tamper-evident issuance log, who has looked it up. Add your Whisper API key to unlock the control plane - register agents with their own /128 and key, set DNS policy, read logs, revoke, and get egress config so a self-hosted agent's traffic sources from its /128.
